# Refreshes the bundled copies of contest-template (main) and sinol-gen (its
# latest tag, as `contest.py update gen` takes it) with bin/sync-assets.sh and
# commits them to main when something changed. That releases them: plugin.json
# has no version, so users get every commit on main.
name: sync assets
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: skill
      - uses: actions/checkout@v7
        with:
          repository: kubat1234/contest-template
          path: contest-template
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: kubat1234/sinol-gen
          path: sinol-gen
          fetch-depth: 0
      - name: sinol-gen at its latest tag
        run: git -C sinol-gen checkout -q "$(git -C sinol-gen tag --sort=-v:refname | head -n 1)"
      - run: skill/bin/sync-assets.sh contest-template sinol-gen
      - name: commit
        working-directory: skill
        run: |
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync assets" -m "$(cat skills/sinol-package/assets/VERSIONS)"
          git push origin HEAD:main
